{% extends "base.html" %}
{% block title %}Nuevo siniestro{% endblock %}
{% block content %}
<h1>Nuevo siniestro</h1>
<div class="card">
    <form method="post">{% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div class="form-row">{{ field.label_tag }} {{ field }} {{ field.errors }}</div>
        {% endfor %}
        <button type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
